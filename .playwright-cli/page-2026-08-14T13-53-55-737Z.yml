        - heading "Ammar Bin Mohammeed Bawazeer" [level=2] [ref=f2e1161]
        - paragraph [ref=f2e1162]: BBA(DSAI) 2nd year
        - blockquote [ref=f2e1163]: “Minutes, motions and follow-ups — the paperwork that stops promises from evaporating.”
        - generic [ref=f2e1164]:
          - text: What they do
          - paragraph [ref=f2e1165]: The General Secretary keeps the Council's official record. Every meeting is minuted, every motion and decision is written down with who is responsible for it, and every follow-up is chased until it's closed. The role also handles the Council's formal correspondence with the university, so requests and complaints go through a documented channel rather than a personal DM.
