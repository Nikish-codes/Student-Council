        - generic [ref=e42]:
          - paragraph [ref=e43]: Why Distortion
          - paragraph [ref=e44]: Distortion is Woxsen’s exclusive music club. If you have a passion for music, we have the talent to back it. We stand for inclusivity, versatility, and an energetic environment. College is a vast campus, which is why we do every genre, every language, and every artist to ensure we cater to every single type of audience. Our activities extend beyond campus performances, as we also participate in battle of the bands competitions. We host an event at the end of every month called Distortion’s Unplugged, where we feature a celebrated artist or band and honor their musical legacy. You do not need to be a musician to experience the best of music; being part of our audience and jamming along is what drives us forward. Whether you wish to take center stage and share your voice with the campus community or simply find your place among fellow music enthusiasts, Distortion will serve you as the ultimate musical home. Join the rhythm, and let the music play on!
